services:
  ollama:
    image: ollama/ollama:0.32.14
    container_name: ai_ifc_ollama
    restart: unless-stopped
    ports:
      - "11450:11434"
    volumes:
      - ollama_data:/root/.ollama
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null && nvidia-smi > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai-ifc-network

  web:
    build: .
    container_name: ai_ifc_vor_generator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DOCUMENTS_PATH: /app/data/perechen_kr.xlsx
      KOEFS_PATH: /app/data/koefs.xlsx
      PRICE_COST_PATH: /app/data/price_cost.xlsx
      UPLOAD_FOLDER: /app/uploads
      OUTPUT_FOLDER: /app/outputs
      SESSIONS_FILE: /app/outputs/sessions.json
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      KB_WORKERS: ${KB_WORKERS:-2}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODELS_DIR: /external/models
      YOLO_LAYOUT_MODEL: /external/models/yolo_layout.pt
      YOLO_LEGEND_LAYOUT_MODEL: /external/models/yolo_legend_layout.pt
      DINO_HATCHING_MODEL: /external/models/dino_hatching.pt
      HATCH_FINDER_MODEL: /external/models/hatch_finder.pt
      WALL_DETECTION__MODEL_NAME: /external/models/yolo_walls_obb.pt
      UNHATCHED_WALL_DETECTION__MODEL_NAME: /external/models/yolo_walls_obb.pt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ports:
      - "127.0.0.1:6001:6000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - /home/projects/external/models:/external/models:ro
    networks:
      - ai-ifc-network

networks:
  ai-ifc-network:
    driver: bridge

volumes:
  ollama_data:
  